[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hzhz"
version = "0.2.0"
description = "Терминальный ИИ-агент на Google Gemini для Linux (CachyOS)"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "rich>=13.0",
]

[project.scripts]
hzhz = "hzhz.cli:main"

[tool.setuptools]
packages = ["hzhz"]
